<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>已经生成的房间</title>
  <meta name="description" content="World Labs 本机测试生成的房间，不含用户上传的厦门和鼓浪屿。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.marble.worldlabs.ai">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
  <style>
    :root {
      --sea: #16343c;
      --sea-deep: #0e2328;
      --salt: #f3eee4;
      --limestone: #d8cfc2;
      --brass: #b08a4a;
      --moss: #3f5d48;
      --tile: #8f4a3a;
      --ink: #1b1712;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--sea-deep);
      color: var(--salt);
      font-family: "Noto Sans SC", "Outfit", sans-serif;
      font-weight: 400;
    }
    button, a { font: inherit; }
    .mast {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1rem 1.4rem;
      background: color-mix(in srgb, var(--sea-deep) 86%, transparent);
      backdrop-filter: blur(10px);
    }
    .mast p {
      margin: 0;
      font-family: "Newsreader", serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--limestone);
    }
    .mast b {
      font-family: "Outfit", sans-serif;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--brass);
    }
    .corridor {
      display: flex;
      flex-direction: column;
      gap: 2.4rem;
      padding: 0.4rem 1.2rem 4rem;
      max-width: 920px;
      margin: 0 auto;
    }
    .door {
      appearance: none;
      border: 0;
      padding: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .door:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 6px;
    }
    .frame {
      position: relative;
      overflow: hidden;
      height: min(78vh, 640px);
      padding: 14px 14px 18px;
      background:
        linear-gradient(180deg, #6d5533 0%, #3d2f1c 18%, #2a2116 100%);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid color-mix(in srgb, var(--brass) 55%, transparent);
      pointer-events: none;
    }
    .room {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(0.92) contrast(1.04);
    }
    .plate {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1rem;
      margin-top: 0.85rem;
      padding: 0 0.2rem;
    }
    .plate-end {
      display: flex;
      flex-direction: column;
      align-items: end;
      gap: 0.45rem;
    }
    .plate h2 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .plate small {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.92rem;
      color: var(--limestone);
    }
    .plate time {
      font-family: "Outfit", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--brass);
      white-space: nowrap;
    }
    .enter {
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--brass);
      color: var(--brass);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      white-space: nowrap;
    }
    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      background: #0a1619;
    }
    .stage.open, .stage.open[hidden] { display: grid; grid-template-rows: auto 1fr auto; }
    .stage-bar, .stage-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 1rem;
    }
    .stage-bar h3 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 1.15rem;
    }
    .stage-bar p, .stage-foot p {
      margin: 0;
      color: var(--limestone);
      font-size: 0.82rem;
    }
    .stage-actions, .stage-foot {
      flex-wrap: wrap;
    }
    .ghost {
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--limestone) 40%, transparent);
      background: transparent;
      color: var(--salt);
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    .ghost[aria-pressed="true"] {
      border-color: var(--brass);
      color: var(--brass);
    }
    .ghost:focus-visible, .marble:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }
    .marble {
      color: var(--brass);
      text-decoration: none;
    }
    #viewer {
      min-height: 0;
      background: #122026;
    }
    #viewer:focus { outline: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); }
    #viewer canvas { width: 100%; height: 100%; display: block; }
    @media (max-width: 700px) {
      .corridor { padding-inline: 0.8rem; gap: 1.8rem; }
      .frame { height: 72vh; padding: 10px 10px 14px; }
      .plate { flex-direction: column; align-items: start; }
      .plate-end { align-items: start; }
      .mast b { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="mast">
    <p>已经生成过的房间，点门走进去。</p>
    <b>World Labs · 6</b>
  </header>
  <main class="corridor" id="corridor"></main>
  <section class="stage" id="stage" hidden>
    <div class="stage-bar">
      <div>
        <h3 id="stage-title"></h3>
        <p id="stage-place"></p>
      </div>
      <div class="stage-actions">
        <button class="ghost" id="quality-preview" type="button">预览</button>
        <button class="ghost" id="quality-standard" type="button">更清楚</button>
        <button class="ghost" id="close-stage" type="button">离开房间</button>
      </div>
    </div>
    <div id="viewer" aria-label="三维房间"></div>
    <div class="stage-foot">
      <p id="stage-status">正在打开房间…</p>
      <a class="marble" id="marble-link" href="#" target="_blank" rel="noreferrer">在 Marble 打开</a>
    </div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
